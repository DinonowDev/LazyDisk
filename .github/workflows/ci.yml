name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-and-test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: xcodebuild -version && swift --version

      - name: Build
        run: swift build

      - name: Test
        run: |
          set -euo pipefail
          swift build --product LazyDisk
          classes=$(swift test --list-tests 2>/dev/null | sed 's|/[^/]*$||' | sed 's|.*\.||' | sort -u)
          for class in $classes; do
            echo "=== swift test --filter ${class} ==="
            swift test --filter "$class"
          done

      - name: APFS clone integration
        run: swift test --filter APFSCloneIntegrationTests

      - name: Build release bundle
        env:
          CODE_SIGN_IDENTITY: ${{ secrets.CODE_SIGN_IDENTITY }}
          VERIFY_BLESS: ${{ secrets.CODE_SIGN_IDENTITY != '' && '1' || '' }}
        run: ./Scripts/build-app.sh

      - name: Upload app artifact
        uses: actions/upload-artifact@v4
        with:
          name: LazyDisk.app
          path: dist/LazyDisk.app
          if-no-files-found: error
