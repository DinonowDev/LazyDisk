name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Test
        run: swift test

      - name: Build release bundle
        run: ./Scripts/build-app.sh

      - name: Package zip
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ditto -c -k --keepParent dist/LazyDisk.app "dist/LazyDisk-${VERSION}-macos.zip"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/LazyDisk-${{ env.VERSION }}-macos.zip
          generate_release_notes: true
          draft: false
          prerelease: false
