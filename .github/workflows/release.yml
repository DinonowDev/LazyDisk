name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: xcodebuild -version && swift --version

      - name: Test
        run: swift test

      - name: Build signed release bundle
        env:
          CODE_SIGN_IDENTITY: ${{ secrets.CODE_SIGN_IDENTITY }}
          NOTARIZE_APP: ${{ secrets.NOTARYTOOL_PROFILE != '' && '1' || '' }}
          NOTARYTOOL_PROFILE: ${{ secrets.NOTARYTOOL_PROFILE }}
          VERIFY_BLESS: ${{ secrets.CODE_SIGN_IDENTITY != '' && '1' || '' }}
        run: ./Scripts/build-app.sh

      - name: Package zip
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ditto -c -k --keepParent dist/LazyDisk.app "dist/LazyDisk-${VERSION}-macos.zip"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/LazyDisk-${{ env.VERSION }}-macos.zip
          body_path: .github/release-notes/${{ github.ref_name }}.md
          generate_release_notes: ${{ hashFiles(format('.github/release-notes/{0}.md', github.ref_name)) == '' }}
          draft: false
          prerelease: false
